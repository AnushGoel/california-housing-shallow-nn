[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "california-housing-shallow-nn"
version = "2.1.0"
description = "A shallow neural network for California housing prices, studied carefully and served three ways"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anush Goel" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
app = ["streamlit>=1.37,<2", "plotly>=5.24,<8", "boto3>=1.34"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
housing-app = "housing_app.cli:main"

[tool.setuptools.packages.find]
include = ["housing_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
extend-exclude = ["notebooks", "results"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]   # syntax errors and undefined names: real bugs, not style
